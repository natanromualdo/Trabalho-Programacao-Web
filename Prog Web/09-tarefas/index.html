<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Exercício 9 — Lista de Tarefas</title>

</head>
<body>

  <div class="pagina">

        <input type="checkbox" id="tarefa1">

        <input type="checkbox" id="tarefa2">

        <input type="checkbox" id="tarefa3">

      <li class="tarefa">
        <input type="checkbox" id="tarefa4">

      </li>

      <li class="tarefa">
        <input type="checkbox" id="tarefa5">
        <label for="tarefa5">Preparar o mise en place da noite</label>
      </li>

      <li class="tarefa">
        <input type="checkbox" id="tarefa6">
        <label for="tarefa6">Confirmar reservas da noite</label>
      </li>

      <li class="tarefa">
        <input type="checkbox" id="tarefa7">

      </li>

    </ul>
